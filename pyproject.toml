[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "awp-sim"
version = "0.1.0a5"
description = "Agent World Protocol reference world: a simulated arm and gripper, in lockstep and streaming."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hyperduality" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "awp-python>=0.1.0a4",
  "jsonschema>=4.23",
  "websockets>=13.0",
]

[project.urls]
Specification = "https://www.agentworldprotocol.com"
Source = "https://github.com/Hyperduality/awp-sim"

[project.scripts]
awp-sim = "awp_sim.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-jsonschema",
]

[tool.uv.sources]
awp-python = { git = "https://github.com/Hyperduality/awp-python", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["src/awp_sim"]

[tool.hatch.build.targets.sdist]
exclude = ["/spec", "/.github"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "ASYNC", "C4", "PIE", "RET"]
ignore = ["ASYNC109"]  # awaitables take explicit timeouts, as websockets' own API does

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["awp_sim"]
branch = true
